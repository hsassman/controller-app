# Builds the Windows app on GitHub's machines, so nobody needs Node.js or
# Rust installed to get a working exe:
#   - PhoneController-Setup.exe  installer: shortcuts, firewall rule and the
#                                ViGEmBus driver in one go
#   - PhoneController.exe        portable, single file (phone page built in)
# Every push to main publishes them as the GitHub Release for the version in
# tauri.conf.json (v1.5.0 -> release "v1.5.0", marked latest). The file names
# never change, so the README's .../releases/latest/download/<file> links
# always point at the newest build.
name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Two quick pushes must not race each other uploading the same release.
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host/src-tauri

      - name: Build the phone app
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Test the host
        working-directory: host/src-tauri
        run: cargo test --locked

      - name: Download the ViGEmBus driver installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force host/src-tauri/drivers | Out-Null
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/ViGEmBus_1.22.0_x64_x86_arm64.exe" `
            -OutFile host/src-tauri/drivers/ViGEmBus_Setup.exe

      - name: Build the exe and installer
        working-directory: host/src-tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - name: Collect the downloads
        id: collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item host/src-tauri/target/release/controller-host.exe release/PhoneController.exe
          $setup = Get-ChildItem host/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $setup.FullName release/PhoneController-Setup.exe
          $version = (Get-Content host/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneController-windows
          path: release/

      - name: Publish the GitHub release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.collect.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Phone Controller ${{ steps.collect.outputs.version }}
          make_latest: "true"
          body: |
            **Download `PhoneController-Setup.exe`** below and run it — it installs the app, the gamepad driver and the firewall rule in one go. Prefer no install? Use `PhoneController.exe` instead.

            Windows may say *"Windows protected your PC"* the first time, because the app isn't code-signed: click **More info → Run anyway**.

            Then open Phone Controller and scan its QR code with your phone. Full instructions: see the [README](https://github.com/${{ github.repository }}#readme).
          files: |
            release/PhoneController-Setup.exe
            release/PhoneController.exe
