[package]
name = "controller-host"
version = "1.7.0"
description = "Host companion app: WebSocket server + virtual gamepad injector"
edition = "2021"

[lib]
name = "controller_host_lib"
# `rlib` only: `staticlib`/`cdylib` are the Tauri template's iOS/Android
# outputs, and this is a Windows desktop app. Building them cost link time
# and produced artifacts nothing consumed.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon`: the host lives in the notification area so it can keep running
# (and keep the phone page reachable) without a window on screen.
tauri = { version = "2", features = ["tray-icon"] }
# Enforces one running copy of the host. Without this, double-clicking the
# exe again (easy to do by habit, or via a stale desktop shortcut) silently
# starts a SECOND instance that falls back to a different port for both the
# WebSocket and the page server -- and plugs in a second, separate virtual
# controller. The phone then has two different addresses to choose from
# depending on which instance served the page it loaded, and whichever one
# it picks may not be the instance a game is actually reading input from.
# Single-instance turns "which window is the real one?" into "there is only
# one," by focusing the existing window instead of starting a competitor.
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "fs", "io-util", "macros"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Lists this PC's network adapters (with their friendly names on Windows),
# so the address put in the QR code is the real Wi-Fi/Ethernet one rather
# than a VPN or virtual adapter the phone can never reach.
local-ip-address = "0.6"
# Compiles the phone page into the exe itself, so the portable build is one
# file: nothing to unzip next to it, nothing to lose when it is copied.
include_dir = "0.7"
# Renders the phone URL as a QR code in the host window, so the address gets
# onto the phone by pointing a camera at it instead of being typed by hand
# on a keypad. `default-features = false` keeps the `image` crate out: the
# window only ever needs the SVG renderer.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# Windows-only: virtual Xbox 360 controller via the ViGEmBus kernel driver.
# Non-Windows builds compile without gamepad injection.
[target.'cfg(windows)'.dependencies]
# `unstable_xtarget_notification` is the crate's name for ViGEm's
# notification API -- how a game's rumble and player-LED requests reach us.
# The driver side of it has been stable for years; only the Rust wrapper
# carries the "unstable" label.
# Launch-at-login lives in the per-user Run key. Already in the build
# graph through Tauri, so this costs nothing extra to compile.
winreg = "0.55"
vigem-client = { version = "0.1", features = ["unstable_xtarget_notification"] }
